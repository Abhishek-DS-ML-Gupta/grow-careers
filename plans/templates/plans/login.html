{% extends "base.html" %}
{% block title %}Login - ObjectTrade{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <div style="text-align: center; margin-bottom: 32px;">
        <h1 style="font-size: 32px; font-weight: 800; color: var(--text-primary);">Welcome Back</h1>
        <p style="color: var(--text-secondary); margin-top: 8px;">Sign in to continue to your dashboard</p>
    </div>
    <div class="form-container">
        <form method="post" class="space-y-5">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="alert alert-error">{{ form.non_field_errors }}</div>
            {% endif %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" required class="form-input" placeholder="Enter your username" autocomplete="username"/>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" required class="form-input" placeholder="Enter your password" autocomplete="current-password"/>
            </div>
            <button type="submit" class="form-submit">Sign In</button>
        </form>
        <div class="form-footer">
            Don't have an account? <a href="{% url 'signup' %}">Create one</a>
        </div>
    </div>
</div>
{% endblock %}
