{% extends "base.html" %}
{% block title %}Sign Up - ObjectTrade{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-milky-100 p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Create Account</h1>
            <p class="text-gray-500 text-sm mt-1">Start trading objects today</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="p-3 rounded-lg bg-red-50 text-red-700 text-sm">{{ form.non_field_errors }}</div>
            {% endif %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required class="w-full rounded-lg border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-milky-500 focus:border-transparent" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password1" required class="w-full rounded-lg border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-milky-500 focus:border-transparent" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" name="password2" required class="w-full rounded-lg border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-milky-500 focus:border-transparent" />
            </div>
            <button type="submit" class="w-full rounded-lg bg-milky-600 py-2.5 text-sm font-semibold text-white hover:bg-milky-700 transition shadow-sm">Create Account</button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            Already have an account? <a href="{% url 'login' %}" class="text-milky-600 font-medium hover:underline">Login</a>
        </p>
    </div>
</div>
{% endblock %}
