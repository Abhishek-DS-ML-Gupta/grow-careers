{% extends "base.html" %}
{% block title %}Create Superuser - ObjectTrade{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <div style="text-align: center; margin-bottom: 32px;">
        <h1 style="font-size: 32px; font-weight: 800; color: var(--text-primary);">Create Admin User</h1>
        <p style="color: var(--text-secondary); margin-top: 8px;">Create a superuser account for admin access</p>
    </div>
    <div class="form-container">
        <form method="post" class="space-y-5">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="alert alert-error">{{ form.non_field_errors }}</div>
            {% endif %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" required class="form-input" placeholder="Choose a username" autocomplete="username"/>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password1" required class="form-input" placeholder="Create a password" autocomplete="new-password"/>
            </div>
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="password2" required class="form-input" placeholder="Confirm your password" autocomplete="new-password"/>
            </div>
            <button type="submit" class="form-submit">Create Superuser</button>
        </form>
        <div class="form-footer">
            <a href="/admin/">Go to Admin Login</a>
        </div>
    </div>
</div>
{% endblock %}
