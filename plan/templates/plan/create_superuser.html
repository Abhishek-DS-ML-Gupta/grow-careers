{% extends "base.html" %}
{% block title %}Superuser Created - ObjectTrade{% endblock %}
{% block content %}
{% if messages %}
  {% for message in messages %}
    <div class="p-4 rounded-lg {% if message.tags == 'success' %}bg-green-800 text-green-100 border border-green-600{% elif message.tags == 'error' %}bg-red-800 text-red-100 border border-red-600{% else %}bg-blue-800 text-blue-100 border border-blue-600{% endif %}">{{ message }}</div>
  {% endfor %}
{% endif %}
<div class="max-w-md mx-auto">
  <div class="p-6 rounded-2xl shadow-lg border border-gray-200 text-center">
    <h1 class="text-2xl font-bold text-gray-900">Superuser Created!</h1>
    <p class="text-gray-700 mt-2">Admin account has been created successfully.</p>
    <a href="{% url 'login' %}" class="inline-block mt-4 px-6 py-2 rounded-lg text-sm font-semibold text-gray-900 bg-gray-100 hover:bg-gray-200 transition border border-gray-200">Go to Login</a>
  </div>
</div>
{% endblock %}
